name: Deploy ke GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Job 1: Build ────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Buat .env.local dengan Supabase credentials
        run: |
          echo "VITE_SUPABASE_URL=https://zzqngubqelbggezkpaxt.supabase.co" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6cW5ndWJxZWxiZ2dlemtwYXh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MDg2OTcsImV4cCI6MjEwNjE4NDY5N30.n6DXlHnfxPylPIDB__uR_7ZNFss4u1jkKzBsVx--nQE" >> .env.local

      - name: Build aplikasi
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact ke Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ── Job 2: Deploy ───────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
